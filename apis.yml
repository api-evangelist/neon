apis:
- aid: neon:data-api
  name: Neon Data API
  description: >-
    The Neon Data API provides a secure, stateless HTTP interface to Neon Postgres databases, allowing
    developers to access and manage data directly from web browsers, serverless functions, and edge runtimes
    using standard HTTP methods. It is fully compatible with PostgREST, enabling querying via standard
    HTTP clients like Postman or cURL. The Data API supports JWT-based authentication and integrates with
    Row-Level Security policies, making it suitable for building secure client-facing applications without
    a traditional backend.
  humanURL: https://neon.com/docs/data-api/overview
  tags:
  - Databases
  - Serverless
  - Postgres
  - REST
  - Data
  - PostgREST
  - HTTP
  properties:
  - type: Documentation
    url: https://neon.com/docs/data-api/overview
  - type: Documentation
    url: https://neon.com/docs/data-api/get-started
- aid: neon:serverless-driver
  name: Neon Serverless Driver
  description: >-
    The Neon Serverless Driver is a low-latency JavaScript and TypeScript driver that enables querying
    Neon Postgres databases from serverless and edge environments over HTTP or WebSockets in place of
    TCP. It supports two query modes: HTTP mode using the neon function for fast single non-interactive
    transactions, and WebSocket mode using Pool and Client constructors for session and transaction support
    with node-postgres compatibility. The driver is available as @neondatabase/serverless on npm and is
    optimized for deployment on platforms like Cloudflare Workers, Vercel Edge Functions, and AWS Lambda.
  humanURL: https://neon.com/docs/serverless/serverless-driver
  tags:
  - Databases
  - Serverless
  - Postgres
  - JavaScript
  - TypeScript
  - WebSocket
  - Edge
  - Driver
  properties:
  - type: Documentation
    url: https://neon.com/docs/serverless/serverless-driver
- aid: neon:auth
  name: Neon Auth
  description: >-
    Neon Auth is a managed authentication service built on Better Auth that connects directly to a Neon
    Postgres database. It stores authentication data including users, sessions, and OAuth configurations
    in the database's neon_auth schema. Neon Auth provides client and server SDKs, supports multiple OAuth
    providers, and integrates with the Neon Data API for automatic JWT validation. It enables Row-Level
    Security policies through the auth.uid() function, allowing developers to implement fine-grained data
    access control based on authenticated users.
  humanURL: https://neon.com/docs/auth/overview
  tags:
  - Authentication
  - Authorization
  - OAuth
  - JWT
  - Security
  - Identity
