aid: neon
name: Neon
description: >-
  Neon is a serverless Postgres platform that provides fully managed, scalable PostgreSQL databases optimized for modern
  cloud and edge application development. Their developer platform offers management APIs, data APIs, authentication
  services, and serverless drivers for building and automating database-driven workflows.
