aid: neon
url: https://raw.githubusercontent.com/api-evangelist/neon/refs/heads/main/apis.yml
modified: '2026-03-20'
apis:
  - aid: neon:management-api
    name: Neon Management API
    tags:
      - Databases
      - Serverless
      - Postgres
      - Projects
      - Branches
      - Compute
      - Infrastructure
    image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://console.neon.tech/api/v2
    humanURL: https://neon.com/docs/reference/api-reference
    properties:
      - url: https://neon.com/docs/reference/api-reference
        type: Documentation
      - url: https://api-docs.neon.tech/reference/getting-started-with-neon-api
        type: Documentation
      - type: OpenAPI
        url: openapi/neon-management-api-openapi.yml
    description: >-
      The Neon Management API is a RESTful interface for programmatically
      managing Neon serverless Postgres resources. It allows developers to
      create and manage projects, branches, databases, roles, compute
      endpoints, and operations. The API uses bearer token authentication
      and supports everything available through the Neon Console,
      enabling automation of database infrastructure workflows. An
      OpenAPI 3.0 specification is available along with TypeScript,
      Python, and Go SDKs.
  - aid: neon:data-api
    name: Neon Data API
    tags:
      - Databases
      - Serverless
      - Postgres
      - REST
      - Data
      - PostgREST
      - HTTP
    image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://api.example.com
    humanURL: https://neon.com/docs/data-api/overview
    properties:
      - url: https://neon.com/docs/data-api/overview
        type: Documentation
      - url: https://neon.com/docs/data-api/get-started
        type: Documentation
    description: >-
      The Neon Data API provides a secure, stateless HTTP interface to
      Neon Postgres databases, allowing developers to access and manage
      data directly from web browsers, serverless functions, and edge
      runtimes using standard HTTP methods. It is fully compatible with
      PostgREST, enabling querying via standard HTTP clients like
      Postman or cURL. The Data API supports JWT-based authentication
      and integrates with Row-Level Security policies, making it
      suitable for building secure client-facing applications without
      a traditional backend.
  - aid: neon:serverless-driver
    name: Neon Serverless Driver
    tags:
      - Databases
      - Serverless
      - Postgres
      - JavaScript
      - TypeScript
      - WebSocket
      - Edge
      - Driver
    image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://api.example.com
    humanURL: https://neon.com/docs/serverless/serverless-driver
    properties:
      - url: https://neon.com/docs/serverless/serverless-driver
        type: Documentation
    description: >-
      The Neon Serverless Driver is a low-latency JavaScript and
      TypeScript driver that enables querying Neon Postgres databases
      from serverless and edge environments over HTTP or WebSockets
      in place of TCP. It supports two query modes: HTTP mode using
      the neon function for fast single non-interactive transactions,
      and WebSocket mode using Pool and Client constructors for session
      and transaction support with node-postgres compatibility. The
      driver is available as @neondatabase/serverless on npm and is
      optimized for deployment on platforms like Cloudflare Workers,
      Vercel Edge Functions, and AWS Lambda.
  - aid: neon:auth
    name: Neon Auth
    tags:
      - Authentication
      - Authorization
      - OAuth
      - JWT
      - Security
      - Identity
    image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://console.neon.tech/api/v2
    humanURL: https://neon.com/docs/auth/overview
    properties:
      - url: https://neon.com/docs/auth/overview
        type: Documentation
      - url: https://neon.com/docs/neon-auth/api
        type: Documentation
      - type: AsyncAPI
        url: asyncapi/neon-auth-webhooks-asyncapi.yml
    description: >-
      Neon Auth is a managed authentication service built on Better Auth
      that connects directly to a Neon Postgres database. It stores
      authentication data including users, sessions, and OAuth
      configurations in the database's neon_auth schema. Neon Auth
      provides client and server SDKs, supports multiple OAuth
      providers, and integrates with the Neon Data API for automatic
      JWT validation. It enables Row-Level Security policies through
      the auth.uid() function, allowing developers to implement
      fine-grained data access control based on authenticated users.
