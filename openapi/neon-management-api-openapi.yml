    put:
      operationId: updateProjectBranchAuth
      summary: Update Auth configuration
      description: >-
        Updates the Neon Auth configuration for the specified branch, including
        enabling or disabling Auth and configuring settings.
      tags:
        - Auth
      parameters:
        - $ref: '#/components/parameters/projectIdParam'
        - $ref: '#/components/parameters/branchIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthConfigUpdate'
      responses:
        '200':
          description: Auth configuration updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  auth:
                    $ref: '#/components/schemas/AuthConfig'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Branch not found
  /projects/{project_id}/branches/{branch_id}/auth/providers:
    get:
      operationId: listNeonAuthOAuthProviders
      summary: List OAuth providers
      description: >-
        Retrieves a list of configured OAuth providers for Neon Auth on the
        specified branch.
      tags:
        - Auth
