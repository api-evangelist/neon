naftiko: 1.0.0-alpha2
info:
  label: Neon Management API — Consumption
  description: 'Neon Management API — Consumption. 2 operations. Lead operation: Get account consumption metrics. Self-contained
    Naftiko capability covering one Neon business surface.'
  tags:
  - Neon
  - Consumption
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    NEON_API_KEY: NEON_API_KEY
capability:
  consumes:
  - type: http
    namespace: management-consumption
    baseUri: https://console.neon.tech/api/v2
    description: Neon Management API — Consumption business capability. Self-contained, no shared references.
    resources:
    - name: consumption_history-account
      path: /consumption_history/account
      operations:
      - name: getconsumptionhistoryperaccount
        method: GET
        description: Get account consumption metrics
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: from
          in: query
          type: string
          description: Start date for the consumption period
          required: true
        - name: to
          in: query
          type: string
          description: End date for the consumption period
          required: true
    - name: consumption_history-projects
      path: /consumption_history/projects
      operations:
      - name: getconsumptionhistoryperproject
        method: GET
        description: Get project consumption metrics
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: from
          in: query
          type: string
          description: Start date for the consumption period
          required: true
        - name: to
          in: query
          type: string
          description: End date for the consumption period
          required: true
    authentication:
      type: bearer
      token: '{{env.NEON_API_KEY}}'
  exposes:
  - type: rest
    namespace: management-consumption-rest
    port: 8080
    description: REST adapter for Neon Management API — Consumption. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/consumption-history/account
      name: consumption-history-account
      description: REST surface for consumption_history-account.
      operations:
      - method: GET
        name: getconsumptionhistoryperaccount
        description: Get account consumption metrics
        call: management-consumption.getconsumptionhistoryperaccount
        with:
          from: rest.from
          to: rest.to
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/consumption-history/projects
      name: consumption-history-projects
      description: REST surface for consumption_history-projects.
      operations:
      - method: GET
        name: getconsumptionhistoryperproject
        description: Get project consumption metrics
        call: management-consumption.getconsumptionhistoryperproject
        with:
          from: rest.from
          to: rest.to
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: management-consumption-mcp
    port: 9090
    transport: http
    description: MCP adapter for Neon Management API — Consumption. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: get-account-consumption-metrics
      description: Get account consumption metrics
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: management-consumption.getconsumptionhistoryperaccount
      with:
        from: tools.from
        to: tools.to
      outputParameters:
      - type: object
        mapping: $.
    - name: get-project-consumption-metrics
      description: Get project consumption metrics
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: management-consumption.getconsumptionhistoryperproject
      with:
        from: tools.from
        to: tools.to
      outputParameters:
      - type: object
        mapping: $.
